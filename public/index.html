            background: linear-gradient(135deg, var(--gold), var(--gold-light));

            -webkit-text-fill-color: transparent;

            margin-bottom: 10px;
        }
        .header p { font-size: 1.3rem; color: var(--gold-light); }

            padding: 30px;

            font-size: 2rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--gold);

        }

            width: 100%;

            border: 1px solid var(--gold);

            color: white;
            font-size: 1.1rem;
            font-family: 'Tajawal', sans-serif;
        }
        .package-options {

            grid-template-columns: repeat(3, 1fr);

            margin: 20px 0;
        }
        .package-card {

            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .package-card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .package-card.selected {
            border-color: var(--gold);
            background: rgba(201, 169, 97, 0.1);
            box-shadow: 0 0 30px rgba(201, 169, 97, 0.3);
        }

        .package-card .price { font-size: 1.8rem; font-weight: 900; color: white; }
